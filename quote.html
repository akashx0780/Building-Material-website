<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Us</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Bootstrap Icons (since you are using bi icons) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Your Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- Contact Section -->
<section id="contact" class="py-5">
    <div class="container">
        <div class="row g-5">
            
            <div class="col-lg-6">
                <h2 class="fw-bold mb-4">Get a Quote Today</h2>
                <p class="text-muted mb-4">
                    Fill out the form and our team will get back to you within 24 hours
                    with a customized quote for your project.
                </p>

                <div class="d-flex mb-3">
                    <div class="flex-shrink-0 text-primary fs-4 me-3">
                        <i class="bi bi-geo-alt-fill"></i>
                    </div>
                    <div>
                        <h5 class="fw-bold mb-1">Our Location</h5>
                        <p class="mb-0 text-muted">
                            123 Builder's Lane, Construction City, ST 54321
                        </p>
                    </div>
                </div>

                <div class="d-flex mb-3">
                    <div class="flex-shrink-0 text-primary fs-4 me-3">
                        <i class="bi bi-telephone-fill"></i>
                    </div>
                    <div>
                        <h5 class="fw-bold mb-1">Call Us</h5>
                        <p class="mb-0 text-muted">+1 (555) 123-4567</p>
                    </div>
                </div>

                <div class="d-flex">
                    <div class="flex-shrink-0 text-primary fs-4 me-3">
                        <i class="bi bi-envelope-fill"></i>
                    </div>
                    <div>
                        <h5 class="fw-bold mb-1">Email Us</h5>
                        <p class="mb-0 text-muted">sales@constructo-example.com</p>
                    </div>
                </div>
            </div>

            <div class="col-lg-6">
                <form id="contactForm" class="p-4 bg-white shadow-sm rounded">
                    
                    <div class="mb-3">
                        <label for="name" class="form-label">Full Name</label>
                        <input type="text" class="form-control" id="name" required>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">Email Address</label>
                        <input type="email" class="form-control" id="email" required>
                    </div>

                    <div class="mb-3">
                        <label for="material" class="form-label">Material Needed</label>
                        <select class="form-select" id="material">
                            <option selected>Select Material...</option>
                            <option value="cement">Cement</option>
                            <option value="steel">Steel</option>
                            <option value="bricks">Bricks</option>
                            <option value="sand">Sand</option>
                            <option value="tiles">Tiles</option>
                            <option value="other">Other</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="message" class="form-label">Message</label>
                        <textarea class="form-control" id="message" rows="4"></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">
                        Send Message
                    </button>

                </form>
            </div>

        </div>
    </div>
</section>

        <div class="text-center mt-5">
            <a href="index.html" class="btn btn-outline-secondary">← Back to Home</a>
        </div>
<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- Your Custom JS -->
<script src="script.js"></script>

</body>
</html>
