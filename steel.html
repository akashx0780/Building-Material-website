  <style>


    
    :root{
      --card-radius: 14px;
      --shadow: 0 10px 26px rgba(17, 24, 39, .08);
      --shadow-hover: 0 18px 38px rgba(17, 24, 39, .14);
    }

    body{
      background:#f6f7fb;
      color:#0f172a;
    }





    :root{
      --accent:#f4b41a;     /* ✅ Your website color */
      --text:#0f172a;
      --muted:#64748b;
      --border:#e5e7eb;
    }


.custom-nav{
  background:#fff;
  box-shadow: 0 4px 15px rgba(0,0,0,0.05);
  position: sticky;
  top: 0;
  z-index: 1030;
}

/* ✅ Back button at LEFT END of the screen */
.back-btn{
  position: absolute;          /* relative to navbar */
  left: 30px;                  /* screen edge spacing */
  top: 50%;
  transform: translateY(-50%);
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: #f3f4f6;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #111;
  text-decoration: none;
  box-shadow: 0 6px 18px rgba(0,0,0,0.06);
  transition: all .25s ease;
  z-index: 1040;               /* above container items */
}

.back-btn:hover{
  background:#d9a441;
  color:#fff;
  transform: translateY(-50%) translateX(-3px);
}
    .nav-link{
      font-weight: 600;
      color: #111827 !important;
    }
    .nav-link:hover{ color: var(--accent) !important; }
    .nav-link.active{ color: var(--accent) !important; }

    .btn-accent{
      background: var(--accent);
      border: none;
      color:#111827;
      font-weight: 700;
      border-radius: 999px;
    }
    .btn-accent:hover{
      filter: brightness(0.95);
      color:#111827;
    }




    /* Section spacing (compact) */
    #products{
      padding: 28px 0 40px;
    }

    /* Grid tighter + premium */
    .product-grid{
      row-gap: 18px;
      column-gap: 0;
    }

    /* Card premium + compact */
    .product-card{
      border: 0;
      border-radius: var(--card-radius);
      overflow: hidden;
      background:#fff;
      box-shadow: var(--shadow);
      transition: transform .2s ease, box-shadow .2s ease;
      height: 100%;
    }
    .product-card:hover{
      transform: translateY(-4px);
      box-shadow: var(--shadow-hover);
    }

    /* Image: same height, neat crop */
    .product-card img{
      height: 150px;        /* ✅ smaller */
      width: 100%;
      object-fit: cover;
      display:block;
      background:#fff;
    }

    .product-card .card-body{
      padding: 12px 12px 14px;  /* ✅ compact */
      display:flex;
      flex-direction:column;
      gap: 10px;
    }

    .product-card .card-title{
      font-size: .98rem;    /* ✅ smaller title */
      line-height: 1.25;
      margin: 0;
      font-weight: 700;
    }

    /* Button: premium + compact */
    .btn-quote{
      border-radius: 12px;
      padding: 9px 12px;
      font-weight: 600;
      font-size: .9rem;
    }

    /* Keep container a bit wider on desktop (looks premium) */
    @media (min-width: 1200px){
      .container{ max-width: 1180px; }
    }

  </style>
